name: tag4-transactions-strict

on:
  push:
    branches: ['tag4-transactions-10of10-v*']
  pull_request:
    branches: [tag4]

jobs:
  transactions_strict_validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pytest numpy
      - name: Run complete Transactions tests
        env:
          PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/transactions_rebuild:${{ github.workspace }}/research/transactions_rebuild/kernel
        run: python -m pytest -q research/transactions_rebuild
      - name: Run independent mathematical cross-validation
        env:
          PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/transactions_rebuild:${{ github.workspace }}/research/transactions_rebuild/kernel
        run: python -m research.transactions_rebuild.benchmarks.strict_cross_validation
      - name: Repeat cross-validation for deterministic audit
        env:
          PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/transactions_rebuild:${{ github.workspace }}/research/transactions_rebuild/kernel
        run: |
          cp experiments/strict_cross_validation.csv /tmp/strict_cv_1.csv
          python -m research.transactions_rebuild.benchmarks.strict_cross_validation
          cmp /tmp/strict_cv_1.csv experiments/strict_cross_validation.csv
      - name: Generate comparison artifacts from frozen release traces
        run: python -m research.transactions_rebuild.benchmarks.generate_publication_tables
      - name: Verify comparison artifacts
        run: test -s experiments/publication_comparison.csv && test -s experiments/publication_tables.tex
      - name: Verify frozen data and figure provenance
        run: python -m research.transactions_rebuild.benchmarks.verify_release_provenance
      - name: Verify implementation-only Transactions gate
        run: test -s research/transactions_rebuild/TRANSACTIONS_PROJECT_10OF10_GATE.md
      - name: Record exact head
        run: git rev-parse HEAD
