name: tag4-pr-validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/transactions_rebuild/**'
      - '.github/workflows/tag4-pr-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy
      - name: Run complete test suite — pass 1
        env:
          PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/transactions_rebuild:${{ github.workspace }}/research/transactions_rebuild/kernel
        run: python -m pytest -q research/transactions_rebuild
      - name: Run complete test suite — pass 2
        env:
          PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/transactions_rebuild:${{ github.workspace }}/research/transactions_rebuild/kernel
        run: python -m pytest -q research/transactions_rebuild
      - name: Run canonical six-scenario benchmark twice and compare
        env:
          PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/transactions_rebuild:${{ github.workspace }}/research/transactions_rebuild/kernel
        run: |
          python -m research.transactions_rebuild.benchmarks.canonical_scenarios
          cp experiments/canonical_scenarios.csv /tmp/canonical_scenarios_1.csv
          python -m research.transactions_rebuild.benchmarks.canonical_scenarios
          cmp /tmp/canonical_scenarios_1.csv experiments/canonical_scenarios.csv
      - name: Record commit
        run: git rev-parse HEAD
