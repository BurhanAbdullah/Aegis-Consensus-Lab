name: tag4-validation

on:
  push:
    branches: [tag4]
  pull_request:
    branches: [tag4]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy matplotlib
      - name: Run tag4 tests
        env:
          PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/transactions_rebuild:${{ github.workspace }}/research/transactions_rebuild/kernel
        run: python -m pytest -q research/transactions_rebuild
      - name: Generate canonical six-scenario benchmark twice
        env:
          PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/transactions_rebuild:${{ github.workspace }}/research/transactions_rebuild/kernel
        run: |
          python -m research.transactions_rebuild.benchmarks.canonical_scenarios
          cp experiments/canonical_scenarios.csv /tmp/canonical_scenarios_1.csv
          python -m research.transactions_rebuild.benchmarks.canonical_scenarios
          cmp /tmp/canonical_scenarios_1.csv experiments/canonical_scenarios.csv
      - name: Run fixed-quorum reference comparison
        env:
          PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/transactions_rebuild:${{ github.workspace }}/research/transactions_rebuild/kernel
        run: python -m research.transactions_rebuild.benchmarks.comparative_reference
      - name: Run analytical boundary sweep
        env:
          PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/transactions_rebuild:${{ github.workspace }}/research/transactions_rebuild/kernel
        run: python -m research.transactions_rebuild.benchmarks.analytical_boundary_sweep
      - name: Run comparative stress grid
        env:
          PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/transactions_rebuild:${{ github.workspace }}/research/transactions_rebuild/kernel
        run: python -m research.transactions_rebuild.benchmarks.comparative_grid
      - name: Run component ablation
        env:
          PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/transactions_rebuild:${{ github.workspace }}/research/transactions_rebuild/kernel
        run: python -m research.transactions_rebuild.benchmarks.ablation
      - name: Run attack localization sweep
        env:
          PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/transactions_rebuild:${{ github.workspace }}/research/transactions_rebuild/kernel
        run: python -m research.transactions_rebuild.benchmarks.localization
      - name: Generate publication figures from frozen CSVs
        env:
          MPLBACKEND: Agg
          PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/transactions_rebuild:${{ github.workspace }}/research/transactions_rebuild/kernel
        run: python -m research.transactions_rebuild.benchmarks.publication_figures
      - name: Verify generated artifacts are non-empty
        run: |
          test -s experiments/comparative_grid.csv
          test -s experiments/ablation.csv
          test -s experiments/localization.csv
          test -s experiments/figures/comparative_attack_phase.pdf
          test -s experiments/figures/component_ablation.pdf
          test -s experiments/figures/attack_localization.pdf
      - name: Record commit
        run: git rev-parse HEAD
