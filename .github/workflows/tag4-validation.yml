name: tag4-validation

on:
  push:
    branches: [tag4]
  pull_request:
    branches: [tag4]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy
      - name: Run tag4 tests
        working-directory: research/transactions_rebuild
        env:
          PYTHONPATH: ${{ github.workspace }}/research/transactions_rebuild
        run: python -m pytest -q
